<!-- cutout.component.html -->
<!-- Formulaire pour permettre à l'utilisateur d'uploader un fichier image et de définir le rectangle -->

<!-- ////  ==== Méthode /process ====  //// -->

<fieldset class="form-fieldset">
  <input type="file" (change)="fileChange($event)" />

  <div class="form-row">
    <label for="upX">X</label>
    <input id="upX" type="number" [(ngModel)]="cutout.upX" />
  </div>

  <div class="form-row">
    <label for="upY">Y</label>
    <input id="upY" type="number" [(ngModel)]="cutout.upY" />
  </div>

  <div class="form-row">
    <label for="width">Width</label>
    <input id="width" type="number" [(ngModel)]="cutout.width" />
  </div>

  <div class="form-row">
    <label for="height">Height</label>
    <input id="height" type="number" [(ngModel)]="cutout.height" />
  </div>
  
  <button (click)="processCutout()">Process cutout</button>
</fieldset>

@if (processedCutout) {
<div>
  <img [src]="getCutoutUrl()" alt="Processed Cutout">
</div>
}
