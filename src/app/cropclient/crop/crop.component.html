<!-- <p>crop works!</p> -->

<div class="container">
  <fieldset>
    <label>
      <input type="radio" name="radiomode" value="frontonly" [(ngModel)]="cropmode">
      Recadrer l'image et la télécharger
    </label>
    <br />
    <label>
      <input type="radio" name="radiomode" value="frontback" [(ngModel)]="cropmode">
      Recadrer l'image et l'enregistrer sur le serveur
    </label>
  </fieldset>
  <br />

  <!-- Crop Image Before Upload.docx (Recadrer l'image et la télécharger) -->

  @if (cropmode()==="frontonly") {
  <div class="card-body">
    <input type="file" (change)="fileChangeEvent($event)" />
    <div class="row" style="margin-top: 15px;">

      <div class="text-center col-md-8">
        <h5>Image</h5>
        <image-cropper style="margin: auto; width: 40%; height: 40%;"
          [imageChangedEvent]="imageChangedEvent"
          [maintainAspectRatio]="true"
          [aspectRatio]="4/ 4"
          [resizeToWidth]="128"
          format="png"
          //output="base64"   // A décommenter en cas d'erreur (L'événement (imageCropped) maj renvoie par défaut un Blob et une objectUrl (event.objectUrl ou event.blob) plutôt que event.base64)
          (imageLoaded)="imageLoaded()"
          (cropperReady)="cropperReady($event)"
          (imageCropped)="imageCropped($event)"
          (loadImageFailed)="loadImageFailed()">
        </image-cropper>
      </div>

      <div class="text-center col-md-4">
        <img [src]="croppedImage" />
      </div>

    </div>
  </div>
  }

  <!-- Upload crop image Springboot Ajax.docx (Recadrer l'image et l'enregistrer sur le serveur) -->

  @else if (cropmode()==="frontback") {

  <form id="upload-file-form">
    <input id="upload-file-input" type="file" name="uploadfile" accept="*" />
    <!-- <input type="file"> génère automatiquement le texte « Choisir un fichier » -->
    <!-- (The input attribute "name" must be the same as the RequestParam in the Spring Boot uploadFile method) -->
  </form>

  <script>
    // bind the on-change event
    $(document).ready(function () {
      $("#upload-file-input").on("change", uploadFile);
    });
    // Upload the file sending it via Ajax at the Spring Boot server.
    // Côté Front-end, la requête $.ajax envoie les données du formulaire (FormData) en multipart/form-data
    //  vers l'adresse /uploadFile du Back-end.
    function uploadFile() {
      $.ajax({
        url: "/uploadFile",
        type: "POST",
        data: new FormData($("#upload-file-form")[0]),
        enctype: 'multipart/form-data',
        processData: false,
        contentType: false,
        cache: false,
        success: function () {
          // Handle upload success
          // ...
        },
        error: function () {
          // Handle upload error
          // ...
        }
      });
    }
  </script>
  }

</div>
